name: pytest

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  MPLBACKEND: Agg
  MPLCONFIGDIR: /tmp/spitzer-matplotlib
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"

jobs:
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: pip install -r requirements.txt
      - name: Dependency consistency
        run: pip check
      - name: Import and compile checks
        run: python -m compileall -q src scripts tests
      - name: Tests (not slow)
        run: pytest -m "not slow and not real_calibration" --tb=short -q --junitxml=test-results/unit.xml
      - name: Synthetic flux recovery and diagnostic plots
        run: python scripts/validate_internal_consistency.py --trials 3 --output-dir test-results/internal-consistency
      - name: Zero-flux boundary diagnostic
        run: python scripts/validate_internal_consistency.py --trials 3 --truth-flux-jy 0 --output-dir test-results/zero-flux
      - name: Stage 1 fixture and metric artifacts
        run: python scripts/generate_stage1_artifacts.py --output-dir test-results/stage1-validation
      - name: Stage 2 independent isolated-star recovery artifacts
        run: python scripts/validate_stage2.py --output-dir test-results/stage2-validation
      - name: Stage 4 positive-GP leakage and uncertainty artifacts
        run: python scripts/validate_stage4.py --quick --draws 4096 --output-dir test-results/stage4-validation
      - name: Stage 5 dense-scalable positive-posterior equivalence
        run: python scripts/validate_stage5.py --quick --draws 4096 --output-dir test-results/stage5-validation
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.python }}
          path: test-results/
  performance:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out pull-request base
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          fetch-depth: 1
      - name: Check out pull-request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: head
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: head/requirements.txt
      - name: Install one identical benchmark environment
        run: pip install -r head/requirements.txt
      - name: Paired cold/warm numerical and performance benchmark
        run: >-
          python head/scripts/run_stage1_benchmarks.py
          --base-repo base
          --head-repo head
          --output-dir benchmark-results
          --repeats 5
          --timeout 45
      - name: Paired Stage 5 positive-posterior consumers
        run: >-
          python head/scripts/run_stage5_benchmarks.py
          --base-repo base
          --head-repo head
          --output-dir benchmark-results/stage5
          --cases small native9
          --repeats 5
          --draws 1024
          --timeout 180
      - name: Upload paired benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paired-stage1-benchmark
          path: benchmark-results/
  extended:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Full synthetic regressions
        run: pytest -m "not real_calibration" --tb=short -q --junitxml=test-results/extended.xml
      - name: Larger synthetic positive/zero coverage diagnostics
        run: |
          python scripts/validate_internal_consistency.py --trials 20 --output-dir test-results/extended-positive
          python scripts/validate_internal_consistency.py --trials 20 --truth-flux-jy 0 --output-dir test-results/extended-zero
      - name: Real calibrated-PRF smoke or explicit skip
        run: pytest -m real_calibration --tb=short -q --junitxml=test-results/real-calibration.xml
      - name: Optional checksum-verified real-data status
        run: python scripts/check_stage1_real_data.py --output test-results/real-data-status.json
      - name: Upload diagnostics and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extended-diagnostics
          path: |
            test-results/
            output/diagnostics/
